<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Addition Game</title>
  <link rel="stylesheet" href="../shared/quiz.css" />
</head>
<body>
  <div class="app">
    <div class="screen start-screen active" id="startScreen">
      <h1 class="title">Addition Game</h1>
      <p class="subtitle">Play through four levels of addition practice.</p>

      <div class="start-art">
        <div class="start-emoji">➕ 2 + 3 = ? ⭐</div>
      </div>

      <div class="button-stack">
        <button class="level-btn" id="playStartBtn">Play Level 1</button>
        <button class="select-btn" id="openLevelSelectFromStartBtn">Select Level</button>
        <a class="back-btn" href="../">Back to Games</a>
      </div>
    </div>

    <div class="screen game-screen" id="gameScreen">
      <div class="problem-box">
        <div class="problem-label" id="problemLabel">Level 1</div>
        <div class="problem" id="problemDisplay">2 + 3</div>
      </div>

      <div class="choices" id="choices"></div>

      <div class="message" id="message" role="status"></div>
      <div class="progress" id="progress"></div>

      <button class="next-btn" id="nextBtn" disabled>Next</button>
    </div>

    <div class="screen end-screen" id="endScreen">
      <h1 class="title">Great Job!</h1>
      <p class="subtitle" id="endSubtitle">You completed Level 1.</p>

      <div class="end-art">
        <div class="end-emoji" id="endEmoji">🎉 ➕ ⭐ 1 2 3 🎉</div>
      </div>

      <div class="button-stack">
        <button class="next-level-btn" id="endPlayBtn">Play Level 2</button>
        <button class="select-btn" id="openLevelSelectFromEndBtn">Select Level</button>
        <a class="back-btn" href="../">Back to Games</a>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="levelModalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="levelModalTitle" tabindex="-1">
      <h2 class="modal-title" id="levelModalTitle">Select Level</h2>
      <p class="modal-subtitle">Choose any level to start playing.</p>

      <div class="modal-buttons">
        <button class="close-btn" id="closeModalBtn">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
