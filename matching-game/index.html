<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matching Grid Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Matching Grid Game</h1>
  <div id="boardName" class="board-name"></div>

  <div class="grid" id="grid"></div>
  <div class="feedback" id="feedback" role="status" aria-atomic="true"></div>

  <div class="bottom-bar">
    <button id="restartBtn">Restart</button>
    <button id="menuBtn">Game Selection</button>
  </div>

  <!-- Game Selection Overlay -->
  <div id="menuOverlay" class="menu-overlay" inert aria-hidden="true">
    <div class="menu-box" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
      <button id="closeMenu" class="close-btn" aria-label="Close game selection">✕</button>
      <h2 id="menuTitle">Select a Game Board</h2>
      <div class="menu-options">
        <button class="menu-option" data-board="fruit">🍎 Fruit</button>
        <button class="menu-option" data-board="shapes">🔺 Shapes</button>
        <button class="menu-option" data-board="transportation">🚒 Transportation</button>
        <a class="menu-option" href="../">Back to Games</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
