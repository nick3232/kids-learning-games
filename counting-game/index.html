<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Counting Game</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7fb;
      color: #222;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .app {
      width: min(100%, 520px);
      min-height: 100dvh;
      padding: 12px 14px 18px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
      align-items: center;
    }

    .screen.active {
      display: flex;
    }

    .start-screen,
    .end-screen {
      justify-content: center;
      gap: 18px;
      text-align: center;
    }

    .title {
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: bold;
      margin: 0;
    }

    .subtitle {
      font-size: 1.1rem;
      margin: 0;
      color: #555;
      max-width: 340px;
      line-height: 1.4;
    }

    .start-art,
    .end-art {
      background: white;
      border-radius: 24px;
      padding: 20px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    .start-emoji,
    .end-emoji {
      font-size: clamp(2.2rem, 10vw, 3.5rem);
      line-height: 1.4;
    }

    .button-stack {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .level-btn,
    .select-btn,
    .again-btn,
    .next-level-btn,
    .next-btn,
    .choice-btn,
    .back-btn,
    .close-btn {
      border: none;
      border-radius: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .level-btn,
    .select-btn,
    .again-btn,
    .next-level-btn,
    .next-btn,
    .back-btn,
    .close-btn {
      width: 100%;
      max-width: 320px;
      padding: 14px 16px;
      font-size: 1.15rem;
      text-decoration: none;
      color: #222;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .level-btn,
    .again-btn,
    .next-level-btn {
      background: #93c5fd;
    }

    .select-btn {
      background: #c4b5fd;
    }

    .back-btn,
    .close-btn {
      background: #cbd5e1;
    }

    .next-btn {
      background: #86efac;
      margin-top: 10px;
    }

    .next-btn:disabled {
      background: #cbd5e1;
      color: #666;
      cursor: not-allowed;
      box-shadow: none;
    }

    .game-screen {
      justify-content: flex-start;
      gap: 10px;
    }

    .choices {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 4px;
    }

    .choice-btn {
      padding: 14px 0;
      font-size: 1.9rem;
      background: #e9e9ff;
    }

    .choice-btn.correct {
      background: #86efac;
    }

    .choice-btn.wrong {
      background: #fca5a5;
    }

    .choice-btn:disabled {
      opacity: 0.98;
      cursor: default;
    }

    .message {
      min-height: 32px;
      font-size: 1.25rem;
      font-weight: bold;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    .progress {
      font-size: 1rem;
      color: #666;
      margin-top: 2px;
    }

    .hidden {
      display: none;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.38);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 20;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      width: min(100%, 360px);
      max-height: calc(100dvh - 36px);
      overflow-y: auto;
      background: white;
      border-radius: 24px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.16);
      padding: 20px 16px 16px;
      text-align: center;
    }

    .modal-title {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }

    .modal-subtitle {
      margin: 0 0 16px;
      color: #555;
      line-height: 1.4;
      font-size: 1rem;
    }

    .modal-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .modal-level-btn.level-1-btn { background: #93c5fd; }
    .modal-level-btn.level-2-btn { background: #a5b4fc; }

    .count-box, .choices {
      flex-shrink: 0;
    }
    .count-box {
      width: 100%;
      min-height: 260px;
      background: white;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      user-select: none;
      padding: 18px 14px;
      gap: 12px;
    }

    .count-label {
      font-size: 1.2rem;
      font-weight: bold;
      color: #666;
      letter-spacing: 0.04em;
      text-align: center;
    }

    .emoji-grid {
      width: 100%;
      display: grid;
      gap: 10px;
      justify-content: center;
      justify-items: center;
      align-items: center;
    }

    .emoji-item {
      font-size: clamp(2.2rem, 10vw, 3.5rem);
      line-height: 1;
    }

  </style>
</head>
<body>
  <div class="app">
    <div class="screen start-screen active" id="startScreen">
      <h1 class="title">Counting Game</h1>
      <p class="subtitle">Choose a level and count the pictures. Then pick the right number.</p>

      <div class="start-art">
        <div class="start-emoji">⭐ ⭐ ⭐<br>🍎 🍎 🍎 🍎<br>🐶 🐶</div>
      </div>

      <div class="button-stack">
        <button class="level-btn" id="playStartBtn">Play Level 1</button>
        <button class="select-btn" id="openLevelSelectFromStartBtn">Select Level</button>
        <a class="back-btn" href="../">Back to Games</a>
      </div>
    </div>

    <div class="screen game-screen" id="gameScreen">
      <div class="count-box">
        <div class="count-label" id="countLabel">Level 1</div>
        <div class="emoji-grid" id="emojiGrid"></div>
      </div>

      <div class="choices" id="choices"></div>

      <div class="message" id="message" role="status"></div>
      <div class="progress" id="progress"></div>

      <button class="next-btn" id="nextBtn" disabled>Next</button>
    </div>

    <div class="screen end-screen" id="endScreen">
      <h1 class="title">Great Job!</h1>
      <p class="subtitle" id="endSubtitle">You completed Level 1.</p>

      <div class="end-art">
        <div class="end-emoji">🎉 1 2 3 4 5 🎉</div>
      </div>

      <div class="button-stack">
        <button class="next-level-btn" id="endPlayBtn">Play Level 2</button>
        <button class="select-btn" id="openLevelSelectFromEndBtn">Select Level</button>
        <a class="back-btn" href="../">Back to Games</a>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="levelModalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="levelModalTitle" tabindex="-1">
      <h2 class="modal-title" id="levelModalTitle">Select Level</h2>
      <p class="modal-subtitle">Choose any level to start playing.</p>

      <div class="modal-buttons">
        <button class="level-btn modal-level-btn level-1-btn" data-level="1">Play Level 1</button>
        <button class="level-btn modal-level-btn level-2-btn" data-level="2">Play Level 2</button>
        <button class="close-btn" id="closeModalBtn">Close</button>
      </div>
    </div>
  </div>

  <script>
    const level1Items = [
      { emoji: "⭐", count: 1, choices: [1, 2, 3, 4] },
      { emoji: "🍎", count: 2, choices: [1, 2, 3, 4] },
      { emoji: "🐶", count: 3, choices: [2, 3, 4, 5] },
      { emoji: "🚗", count: 4, choices: [3, 4, 5, 6] },
      { emoji: "🌈", count: 5, choices: [4, 5, 6, 7] },
      { emoji: "🍌", count: 1, choices: [1, 2, 3, 4] },
      { emoji: "🐸", count: 2, choices: [1, 2, 3, 4] },
      { emoji: "⚽", count: 3, choices: [2, 3, 4, 5] },
      { emoji: "🦋", count: 4, choices: [3, 4, 5, 6] },
      { emoji: "🍪", count: 5, choices: [4, 5, 6, 7] }
    ];

    const level2Items = [
      { emoji: "⭐", count: 6, choices: [5, 6, 7, 8] },
      { emoji: "🍎", count: 7, choices: [6, 7, 8, 9] },
      { emoji: "🐶", count: 8, choices: [7, 8, 9, 10] },
      { emoji: "🚗", count: 9, choices: [8, 9, 10, 11] },
      { emoji: "🌈", count: 10, choices: [9, 10, 11, 12] },
      { emoji: "🍌", count: 6, choices: [5, 6, 7, 8] },
      { emoji: "🐸", count: 7, choices: [6, 7, 8, 9] },
      { emoji: "⚽", count: 8, choices: [7, 8, 9, 10] },
      { emoji: "🦋", count: 9, choices: [8, 9, 10, 11] },
      { emoji: "🍪", count: 10, choices: [9, 10, 11, 12] }
    ];

    let items = [];
    let currentIndex = 0;
    let answered = false;
    let currentLevel = 1;

    const startScreen = document.getElementById("startScreen");
    const gameScreen = document.getElementById("gameScreen");
    const endScreen = document.getElementById("endScreen");

    const playStartBtn = document.getElementById("playStartBtn");
    const endPlayBtn = document.getElementById("endPlayBtn");

    const countLabel = document.getElementById("countLabel");
    const emojiGrid = document.getElementById("emojiGrid");
    const choicesEl = document.getElementById("choices");
    const messageEl = document.getElementById("message");
    const progressEl = document.getElementById("progress");
    const nextBtn = document.getElementById("nextBtn");

    const endSubtitle = document.getElementById("endSubtitle");

    function shuffleArray(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function showScreen(screenToShow) {
      startScreen.classList.remove("active");
      gameScreen.classList.remove("active");
      endScreen.classList.remove("active");
      screenToShow.classList.add("active");
      screenToShow.setAttribute("tabindex", "-1");
      screenToShow.focus();
      window.scrollTo(0, 0);
    }

    function getLevelItems(level) {
      return level === 1 ? level1Items : level2Items;
    }

    function startGame(level) {
      currentLevel = level;
      items = shuffleArray(getLevelItems(level));
      currentIndex = 0;
      closeLevelModal();
      showScreen(gameScreen);
      renderItem();
    }

    function getGridColumns(count) {
      if (count <= 3) return count;
      if (count <= 6) return 3;
      if (count <= 8) return 4;
      return 5;
    }

    function renderEmojiSet(item) {
      emojiGrid.innerHTML = "";
      emojiGrid.style.gridTemplateColumns = `repeat(${getGridColumns(item.count)}, minmax(0, auto))`;

      for (let i = 0; i < item.count; i++) {
        const span = document.createElement("div");
        span.className = "emoji-item";
        span.textContent = item.emoji;
        emojiGrid.appendChild(span);
      }
    }

    function renderItem() {
      answered = false;
      messageEl.textContent = "";
      nextBtn.disabled = true;

      const item = items[currentIndex];
      countLabel.textContent = "Level " + currentLevel;
      progressEl.textContent = (currentIndex + 1) + " / " + items.length;

      renderEmojiSet(item);

      const shuffledChoices = shuffleArray(item.choices);
      choicesEl.innerHTML = "";

      shuffledChoices.forEach(number => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = number;
        btn.addEventListener("click", () => handleChoice(btn, number, item.count));
        choicesEl.appendChild(btn);
      });
    }

    function handleChoice(button, selectedNumber, correctNumber) {
      if (answered) return;

      const allButtons = document.querySelectorAll(".choice-btn");

      if (selectedNumber === correctNumber) {
        answered = true;
        button.classList.add("correct");
        messageEl.textContent = "Great job!";
        nextBtn.disabled = false;

        allButtons.forEach(btn => {
          btn.disabled = true;
          if (Number(btn.textContent) === correctNumber) {
            btn.classList.add("correct");
          }
        });
      } else {
        button.classList.add("wrong");
        messageEl.textContent = "Try again!";
        button.disabled = true;
      }
    }

    function showEndScreen() {
      endSubtitle.textContent = "You completed Level " + currentLevel + ".";
      endPlayBtn.textContent = currentLevel < 2 ? "Play Level 2" : "Play Level 2 Again";
      endPlayBtn.onclick = () => startGame(2);
      showScreen(endScreen);
    }

    function goToNextItem() {
      if (!answered) return;

      currentIndex++;

      if (currentIndex >= items.length) {
        showEndScreen();
        return;
      }

      renderItem();
    }

    playStartBtn.addEventListener("click", () => startGame(1));
    nextBtn.addEventListener("click", goToNextItem);
    const levelModalOverlay = document.getElementById("levelModalOverlay");
    const levelModal = levelModalOverlay.querySelector(".modal");
    const app = document.querySelector(".app");
    let modalOpener = null;

    function openLevelModal(event) {
      modalOpener = event.currentTarget;
      levelModalOverlay.classList.add("active");
      app.inert = true;
      levelModal.querySelector("button").focus();
    }

    function closeLevelModal() {
      levelModalOverlay.classList.remove("active");
      app.inert = false;
      if (modalOpener) modalOpener.focus();
    }

    document.getElementById("openLevelSelectFromStartBtn").addEventListener("click", openLevelModal);
    document.getElementById("openLevelSelectFromEndBtn").addEventListener("click", openLevelModal);
    document.getElementById("closeModalBtn").addEventListener("click", closeLevelModal);
    levelModalOverlay.addEventListener("click", event => {
      if (event.target === levelModalOverlay) closeLevelModal();
    });
    levelModalOverlay.addEventListener("keydown", event => {
      if (event.key === "Escape") closeLevelModal();
      if (event.key !== "Tab") return;
      const buttons = [...levelModal.querySelectorAll("button")];
      const first = buttons[0];
      const last = buttons[buttons.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    });
    document.querySelectorAll(".modal-level-btn").forEach(button => {
      button.addEventListener("click", () => startGame(Number(button.dataset.level)));
    });
  </script>
</body>
</html>
