<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dino Match-Up Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Dino Match-Up!</h1>
  <p>Match each dinosaur’s <strong>name</strong> with its <strong>picture</strong>.</p>

  <div id="status-bar">
    <span id="score">⭐ Score: 0</span>
    <span id="timer">⏱ 0s</span>
  </div>

  <div id="game-board" class="game-board"></div>

  <div id="main-buttons">
    <button id="restart">Play Again</button>
    <a id="backToGamesBtn" class="back-btn" href="../">Back to Games</a>
  </div>

  <div id="message"></div>

  <script src="script.js"></script>
</body>
<footer>
  <button class="back-btn" onclick="window.location.href='credits.html'">Image Credits</button>
</footer>
</html>
